<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>museum-group6</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'Noto Sans TC', Arial, sans-serif;
    }
  </style>

  <!-- Swiper 官方提供的 CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
</head>
<body>
  <!-- 頁首 -->
  <header class="site-header">
    <div class="logo">
      <a href="index.html">
        <img src="images/items/tea.png" alt="Logo">
      </a>
    </div>
    <nav class="top-nav">
    </nav>
  </header>

  <!-- 背景層 -->
  <div class="background"></div>

  <!-- 中間橫幅 hero banner -->
  <main class="hero-banner">
    <h1>一盞千年：中國飲茶文化的時光旅程</h1>
  </main>

  <!-- 主導覽列 -->
  <nav class="main-nav">
  <a href="index.html">首頁</a>
  <a href="team_members.html">關於我們</a>
  <a href="idea.html">策展理念</a>
  <a href="activity.html">活動</a>

  <!-- 下拉式選單：策展主題 -->
  <div class="dropdown" id="themeDropdown">
    <button class="dropbtn" id="dropbtn" aria-haspopup="true" aria-expanded="false">策展主題 ▾</button>
    <ul class="dropdown-menu" role="menu" aria-label="策展主題列表">
      <li role="none"><a role="menuitem" href="exhibition1.html">茶與文人詩畫</a></li>
      <li role="none"><a role="menuitem" href="exhibition2.html">唐代煮茶與宋代點茶文化</a></li>
      <li role="none"><a role="menuitem" href="exhibition3.html">茶色與茶盞搭配的美學</a></li>
      <li role="none"><a role="menuitem" href="exhibition4.html">明清大調「茶」</a></li>
    </ul>
  </div>

    <input type="text" id="searchInput" placeholder="在這裡搜索">
    <button type="button" onclick="search()">🔍</button>
  </nav>

  <!-- 輪播廣告區 -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
  <img src="images\items\home.png" alt="看板1">
      </div>
      <div class="swiper-slide">
  <img src="images\items\taolung.jpg" alt="看板2">
      </div>
      
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- 功能選單區 -->
  <section class="feature-grid">
    <a href="exhibition1.html" class="feature-item">
  <img src="images/items/exhibition.png" alt="展覽一">
      <span>文心煮茗閣：</span>
      <span>茶與文人詩畫</span>
    </a>
    <a href="exhibition2.html" class="feature-item">
  <img src="images/items/exhibition.png" alt="展覽二">
      <span>湯聲墨影室:</span>
      <span>唐代煮茶與宋代點茶文化</span>
    </a>
    <a href="exhibition3.html" class="feature-item">
  <img src="images/items/exhibition.png" alt="展覽三">
      <span>釉光映茗坊:</span>
      <span>茶色與茶盞搭配的美學</span>
    </a>
      <a href="exhibition4.html" class="feature-item">
  <img src="images/items/exhibition.png" alt="展覽四">
      <span>香遠流年館:</span>
      <span>明清大調「茶」</span>
    </a>
  </section>

  <!-- Swiper JS -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      loop: true,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
      autoplay: {
        delay: 3000,
        disableOnInteraction: false,
      },
    });

    function search() {
      var value = document.getElementById('searchInput').value.trim();
      if (!value) return;
      var keyword = value.toLowerCase();
      if (keyword.includes('成員') || keyword.includes('關於')) {
        window.location.href = 'team_members.html';
      } else if (keyword.includes('首頁')) {
        window.location.href = 'index.html';
      } else if (keyword.includes('理念')) {
        window.location.href = 'idea.html';
      } else if (keyword.includes('活動') || keyword.includes('茶語') || keyword.includes('投稿')) {
        window.location.href = 'activity.html';
      } else {
        alert('找不到相關內容');
      }
    }
  </script>
  <script>
    // Dropdown: 點擊切換，點擊外側關閉
    (function() {
      var dropdown = document.getElementById('themeDropdown');
      var btn = document.getElementById('dropbtn');

      if (!dropdown || !btn) return;

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var open = dropdown.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      // 點擊選單項時也關閉選單
      dropdown.addEventListener('click', function(e) {
        var target = e.target;
        if (target.tagName.toLowerCase() === 'a') {
          dropdown.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });

      // 點擊頁面其他地方關閉
      document.addEventListener('click', function() {
        if (dropdown.classList.contains('open')) {
          dropdown.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });

      // 鍵盤可存取性：Esc 關閉
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (dropdown.classList.contains('open')) {
            dropdown.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
            btn.focus();
          }
        }
      });
    })();
  </script>
</body>
</html>
